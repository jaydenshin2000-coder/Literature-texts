<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fragments.txt</title>
    <style>
        body {
            background-color: #000000; /* 순백색 바탕 */
            color: #ffffff;           /* 완전한 순도 100% 검은색 글자 */
            
            /* 1. 컴퓨터 메모장 특유의 딱딱하고 로우한 폰트 고정 */
            font-family: 'Courier New', Courier, Monaco, 'Lucida Console', monospace; 
            
            /* 2. 텍스트 파일 특유의 자잘하고 다듬어지지 않은 글자 크기 */
            font-size: 13px; 
            
            /* 3. 줄간격과 자간을 윈도우 메모장 기본값처럼 좁고 빽빽하게 세팅 */
            line-height: 1.5; 
            letter-spacing: 0; 
            
            /* 4. 여백을 최소화하여 화면 왼쪽 구석에 툭 처박히는 정렬 */
            padding: 20px 16px; 
            max-width: 100%; 
            margin: 0; 
            
            /* 5. 띄어쓰기, 줄바꿈, 메모장에서 스페이스바 친 공간까지 날것 그대로 노출 */
            white-space: pre-wrap; 
            word-break: break-all;
        }
    </style>
</head>
<body>

The days before my ending
Dying in the flowers
Petals pity my dreams
Ahead I see a pupil
Dark, so dark light my destiny

</body>
</html>
